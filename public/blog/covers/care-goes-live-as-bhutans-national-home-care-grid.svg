<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CARE goes live as Bhutan's national home care grid</title>
  <desc id="desc">CARE's deployment as Bhutan's national home care grid and the OHC team's visit focused on palliative care.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f8f6"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1f2933" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M0 780C230 700 320 860 505 760C700 656 720 515 930 565C1168 621 1258 448 1600 498V1000H0Z" fill="#0f766e" opacity="0.08"/>
  <rect x="84" y="84" width="1432" height="832" rx="44" fill="none" stroke="#1f2933" stroke-width="3" opacity="0.14"/>
  <text x="140" y="180" fill="#0f766e" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">ACTIVITIES / OHC ARCHIVE</text>
  <text x="140" y="752" fill="#63736d" font-family="Arial, sans-serif" font-size="26" font-weight="600">Aug 31, 2026</text>
  <text x="140" y="812" fill="#1f2933" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">CARE / OPEN HEALTHCARE NETWORK</text>
  <text x="140" y="380" fill="#1f2933" font-family="Arial, sans-serif" font-size="82" font-weight="700">CARE goes live as</text>
  <text x="140" y="480" fill="#1f2933" font-family="Arial, sans-serif" font-size="82" font-weight="700">Bhutan's national</text>
  <text x="140" y="580" fill="#1f2933" font-family="Arial, sans-serif" font-size="82" font-weight="700">home care grid</text>
  <rect x="920" y="195" width="420" height="510" rx="34" fill="#fff" stroke="#1f2933" stroke-width="3" opacity="0.94"/>
  <path d="M1000 300h100v100h100v100h-100v100h-100V500H900V400h100z" fill="#0f766e" opacity="0.94"/>
  <rect x="970" y="635" width="320" height="14" rx="7" fill="#1f2933" opacity="0.17"/>
  <rect x="970" y="675" width="250" height="14" rx="7" fill="#3f82f6" opacity="0.8"/>
  <path d="M140 676H615" stroke="#3f82f6" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 704H455" stroke="#f0b429" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
