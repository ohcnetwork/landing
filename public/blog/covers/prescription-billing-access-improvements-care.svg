      <rect x="1230" y="640" width="30" height="25" rx="6" fill="#0b6b55" opacity="0.2"/>
      <rect x="1275" y="640" width="30" height="25" rx="6" fill="#d66f3d" opacity="0.3"/>
    </g>

    <path d="M910 705 C1020 610 1125 760 1240 640 C1295 584 1325 580 1370 615" fill="none" stroke="#e9b44c" stroke-width="9" stroke-linecap="round"/>
