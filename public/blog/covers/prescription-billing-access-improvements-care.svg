<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prescription, billing, and access improvements in CARE</title>
  <desc id="desc">July 2026 spanned prescriptions and dosing, appointments and billing, observation and medication data aligned with FHIR, password reset by phone, and nutrition added to the administration workflow.</desc>
  <defs>
    <pattern id="microgrid-prescription-billing" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#12312c" stroke-width="1" opacity="0.08"/>
    </pattern>
    <linearGradient id="wash-prescription-billing" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset="0.58" stop-color="#e2eee7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wash-prescription-billing)"/>
  <rect width="1600" height="1000" fill="url(#microgrid-prescription-billing)"/>
  <path d="M0 780 C230 700 320 860 505 760 C700 656 720 515 930 565 C1168 621 1258 448 1600 498 V1000 H0 Z" fill="#0b6b55" opacity="0.08"/>
  <rect x="84" y="84" width="1432" height="832" rx="44" fill="none" stroke="#12312c" stroke-width="3" opacity="0.14"/>
  <text x="140" y="180" fill="#0b6b55" font-family="'Switzer', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">CARE / OHC ARCHIVE</text>
  <text x="140" y="752" fill="#5f6f69" font-family="'Switzer', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600">July 31, 2026</text>
  <text x="140" y="812" fill="#12312c" font-family="'Switzer', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">CARE / OPEN HEALTHCARE NETWORK</text>
  <g font-family="'Switzer', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="0" fill="#12312c">
    <text x="140" y="310">Prescription, billing,</text>
    <text x="140" y="394">and access</text>
    <text x="140" y="478">improvements</text>
  </g>
  <g transform="translate(61 0)">
